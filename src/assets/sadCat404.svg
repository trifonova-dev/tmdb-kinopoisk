<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none">
  <defs>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f5ff"/>
      <stop offset="1" stop-color="#3fbde6"/>
    </linearGradient>
  </defs>

  <!-- tail -->
  <path d="M158 190 C196 196 210 166 196 148 C188 138 176 144 180 154" stroke="#9fb0c2" stroke-width="14" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="120" cy="174" rx="46" ry="34" fill="#9fb0c2"/>
  <ellipse cx="120" cy="182" rx="24" ry="20" fill="#e6edf4"/>

  <!-- paws -->
  <ellipse cx="102" cy="205" rx="14" ry="9" fill="#e6edf4"/>
  <ellipse cx="138" cy="205" rx="14" ry="9" fill="#e6edf4"/>

  <!-- ears, slightly lowered -->
  <g transform="rotate(-12 84 70)">
    <path d="M60 84 C52 52 58 30 70 28 C84 28 98 46 106 58 Z" fill="#9fb0c2"/>
    <path d="M68 72 C64 54 68 42 74 41 C82 42 90 52 94 60 Z" fill="#f4bcc8"/>
  </g>
  <g transform="rotate(12 156 70)">
    <path d="M180 84 C188 52 182 30 170 28 C156 28 142 46 134 58 Z" fill="#9fb0c2"/>
    <path d="M172 72 C176 54 172 42 166 41 C158 42 150 52 146 60 Z" fill="#f4bcc8"/>
  </g>

  <!-- head -->
  <ellipse cx="120" cy="100" rx="66" ry="56" fill="#9fb0c2"/>

  <!-- muzzle -->
  <ellipse cx="120" cy="123" rx="28" ry="19" fill="#e6edf4"/>

  <!-- blush -->
  <ellipse cx="70" cy="121" rx="10" ry="6" fill="#f4a3b4" opacity="0.6"/>
  <ellipse cx="170" cy="121" rx="10" ry="6" fill="#f4a3b4" opacity="0.6"/>

  <!-- whiskers -->
  <path d="M90 123 L64 119 M90 129 L66 133" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M150 123 L176 119 M150 129 L174 133" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- eyes -->
  <ellipse cx="93" cy="100" rx="13" ry="15" fill="#1b2430"/>
  <ellipse cx="147" cy="100" rx="13" ry="15" fill="#1b2430"/>

  <!-- light eyelids: outer corners a little lower -->
  <path d="M76 80 L110 80 L110 85 L76 93 Z" fill="#9fb0c2"/>
  <path d="M164 80 L130 80 L130 85 L164 93 Z" fill="#9fb0c2"/>

  <!-- eye shine -->
  <circle cx="97" cy="95" r="4.5" fill="#ffffff"/>
  <circle cx="151" cy="95" r="4.5" fill="#ffffff"/>
  <circle cx="89" cy="106" r="2.2" fill="#ffffff"/>
  <circle cx="143" cy="106" r="2.2" fill="#ffffff"/>

  <!-- sad eyebrows -->
  <path d="M80 80 Q91 75 103 71" stroke="#5f7184" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M160 80 Q149 75 137 71" stroke="#5f7184" stroke-width="3.2" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M114 115 Q120 111 126 115 Q120 122 114 115 Z" fill="#f08aa0"/>

  <!-- sad mouth -->
  <path d="M111 134 Q120 127 129 134" stroke="#1b2430" stroke-width="2.6" stroke-linecap="round"/>

  <!-- tears, glossy, on top of the face -->
  <path d="M84 112 C86 116 90 121 90 126 A6 6 0 0 1 78 126 C78 121 82 116 84 112 Z" fill="url(#tear)"/>
  <ellipse cx="82" cy="125" rx="1.4" ry="2.6" fill="#ffffff" opacity="0.9"/>

  <path d="M157 113 C158.5 116 161 119 161 122.5 A4 4 0 0 1 153 122.5 C153 119 155.5 116 157 113 Z" fill="url(#tear)"/>
  <ellipse cx="155.8" cy="122" rx="1" ry="1.8" fill="#ffffff" opacity="0.9"/>

  <!-- question marks -->
  <text x="190" y="54" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#01b4e4">?</text>
  <text x="212" y="82" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#90cea1">?</text>
  <text x="24" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#3cbec9">?</text>
</svg>
